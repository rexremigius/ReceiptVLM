# Pins a dark base theme matching app/streamlit_app.py's palette so
# Streamlit's native widgets render dark against our dark surfaces. The light-mode toggle
# is a CSS override on top of this base.
[theme]
base = "dark"
primaryColor = "#22DD8A"
backgroundColor = "#14161B"
secondaryBackgroundColor = "#1E212B"
textColor = "#F4F6FA"
font = "sans serif"
